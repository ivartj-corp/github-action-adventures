name: "Mergeback"
run-name: "Mergeback from ${{ github.ref }}"
on:
  push:
    branches:
    - main
    - test
permissions:
  contents: read
jobs:
  mergeback:
    runs-on: ubuntu-latest
    environment: automergeback
    concurrency:
      group: mergeback-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: 'false'  # the remainder of the workflow will use different credentials

    - name: Get GitHub App token
      uses: actions/create-github-app-token@v3
      id: app-token
      with:
        # required
        client-id: '${{ vars.APP_CLIENT_ID }}'
        private-key: '${{ secrets.APP_PRIVATE_KEY }}'
        permission-contents: write
        permission-pull-requests: write

    - name: Git authentication
      id: get-user-id
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      run: |
        gh_user_id="$(gh api "/users/${GH_APP_SLUG}[bot]" --jq .id)"
        git config --global user.name "${GH_APP_SLUG}[bot]"
        git config --global user.email "${gh_user_id}+${GH_APP_SLUG}[bot]@users.noreply.github.com"
        gh auth setup-git

    - name: Mergeback
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        source_branch="${GITHUB_REF#refs/heads/}"  # strip refs/heads/ prefix
        .github/workflows/automergeback.sh "$source_branch" --mergeback-pr-label=mergeback
