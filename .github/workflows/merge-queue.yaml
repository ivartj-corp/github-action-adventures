name: Merge queue
on:
  merge_group:
    types: [checks_requested]
    branches: [main]
jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.init.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '2'
      - id: init
        run: |
          set -euo pipefail
          set -x
          selected_modules="$(<config.sandbox.yaml yq -o json | jq .environment.selected -r)"
          changed_modules="$(git diff --name-only HEAD^ | grep -o -F "$selected_modules" | LC_ALL=C sort -u)"
          echo 'modules<<EOF'
          echo "$changed_modules" | jq -R | jq -s -c
          echo 'EOF'
  deploy:
    runs-on: ubuntu-latest
    needs: init
    strategy:
      matrix:
        module: ${{ fromJson(needs.init.outputs.modules) }}
    steps:
      - run: |
          echo "$module"
        env:
          module: ${{ matrix.module }}

