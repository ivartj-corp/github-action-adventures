---
name: msgraft-container-image
run-name: ${{ github.actor }} is learning GitHub Actions
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/actions/msgraft/**/*"
permissions:
  packages: write
  contents: read
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}/msgraft:latest
          context: .github/actions/msgraft
      - run: |
          docker run ghcr.io/${{ github.repository }}/msgraft:latest -AccessToken bad-access-token
      - name: 'List groups'
        uses: ./.github/actions/msgraft
        with:
          access-token: bad-access-token

