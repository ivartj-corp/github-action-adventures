on:
  workflow_dispatch:
    inputs:
      cdf_project:
        description: 'CDF project to deploy to'
        required: true
        type: choice
        options:
          - abp-greenfield-sandbox
          - abp-dev
          - abp-test
          - abp
      manifest_path:
        description: Path to manifest file in repository that should be deployed
        required: true
        type: string
        default: 'flows-apps/'
      dry_run:
        description: 'Dry run (do everything up to `cognite apps deploy`)'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Enable bash debugging (set -x)'
        required: false
        type: boolean
        default: false
jobs:
  do-nothing:
    runs-on: ubuntu-latest
    steps:
      - run: true
