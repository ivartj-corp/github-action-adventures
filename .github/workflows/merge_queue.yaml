name: Merge queue
on:
  merge_group:
    types:
      - checks_requested
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      deplvls_json: ${{ steps.orchestrate.outputs.deplvls_json }}
      deplvls_count: ${{ steps.orchestrate.outputs.deplvls_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '2'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: orchestrate
        run: |
          set -euo pipefail
          set -x
          selected_modules="$(
            <config.sandbox.yaml yq -o json \
            | jq '.environment.selected[]' -r
          )"
          old_selected_modules="$(
            git show 'HEAD^:config.sandbox.yaml' \
            | yq -o json \
            | jq '.environment.selected[]' -r
          )"
          new_selected_modules="$(
            echo "$selected_modules" \
            | (grep -v -x -F "$old_selected_modules" || true)
          )"
          changed_modules_json="$(
            git diff --name-only HEAD^ \
            | python .github/workflows/merge_queue.py parentpaths \
            | (grep -o -x -F "$selected_modules" || true) \
            | cat - <(echo "$new_selected_modules") \
            | LC_ALL=C sort -u \
            | jq -R 'select(length != 0)' \
            | jq -s -c
          )"
          deplvls_json="$(
            set -euo pipefail
            find modules -maxdepth 1 -mindepth 1 -type d -print0 \
            | while read -r -d '' module; do
                jq -n \
                  --arg module_name "$module" \
                  --arg dependencies "$(tr -d '\r' < "$module/dependencies.txt")" \
                  '{
                    key: $module_name,
                    value: [$dependencies | split("\n") | .[] | select(length != 0)]
                  }'
              done \
            | jq -s 'from_entries' \
            | python .github/workflows/merge_queue.py deplvls \
                --max-deplvls=3 \
            | jq -c \
                --argjson changed_modules "$changed_modules_json" \
                '[
                  .[]
                  | [
                      .[] | select([$changed_modules[] == .] | any)
                    ]
                  | select(length != 0)
                ]'
          )"
          (
            echo "deplvls_json=$deplvls_json"
            echo "deplvls_count=$(echo "$deplvls_json" | jq length)"
          ) >> "$GITHUB_OUTPUT"

  deplvl-0:
    runs-on: ubuntu-latest
    needs:
      - gate
    if: needs.gate.outputs.deplvls_count > 0
    strategy:
      matrix:
        module: ${{ fromJson(needs.gate.outputs.deplvls_json)[0] }}
    environment: ${{ matrix.module }}
    steps:
      - env:
          module_name: ${{ matrix.module }}
        run: |
          echo "$module_name"

  deplvl-1:
    runs-on: ubuntu-latest
    needs:
      - gate
      - deplvl-0
    if: needs.gate.outputs.deplvls_count > 1
    strategy:
      matrix:
        module: ${{ fromJson(needs.gate.outputs.deplvls_json)[1] }}
    environment: ${{ matrix.module }}
    steps:
      - env:
          module_name: ${{ matrix.module }}
        run: |
          echo "$module_name"

  deplvl-2:
    runs-on: ubuntu-latest
    needs:
      - gate
      - deplvl-1
    if: needs.gate.outputs.deplvls_count > 2
    strategy:
      matrix:
        module: ${{ fromJson(needs.gate.outputs.deplvls_json)[2] }}
    environment: ${{ matrix.module }}
    steps:
      - env:
          module_name: ${{ matrix.module }}
        run: |
          echo "$module_name"

