name: Merge queue
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:
    types:
      - checks_requested
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      dependency_layers_json: ${{ steps.orchestrate.outputs.dependency_layers_json }}
      dependency_layers_count: ${{ steps.orchestrate.outputs.dependency_layers_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '2'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: orchestrate
        run: |
          set -euo pipefail
          set -x
          selected_modules="$(
            <config.sandbox.yaml yq -o json \
            | jq '.environment.selected[]' -r
          )"
          changed_modules_json="$(
            git diff --name-only HEAD^ \
            | python .github/workflows/merge_queue.py parentpaths \
            | (grep -o -x -F "$selected_modules" || true) \
            | LC_ALL=C sort -u \
            | jq -R \
            | jq -s -c
          )"
          dependency_layers_json="$(
            set -euo pipefail
            find modules -maxdepth 1 -mindepth 1 -type d -print0 \
            | while read -r -d '' module; do
                jq -n \
                  --arg module_name "$module" \
                  --arg dependencies "$(cat "$module/dependencies.txt")" \
                  '{
                    key: $module_name,
                    value: ($dependencies | split("\n"))
                  }'
              done \
            | jq -s 'from_entries' \
            | python .github/workflows/merge_queue.py layers \
                --max-layers=3 \
            | jq -c \
                --argjson changed_modules "$changed_modules_json" \
                '[
                  .[]
                  | [
                      .[] | select([$changed_modules[] == .] | any)
                    ]
                  | select(length != 0)
                ]'
          )"
          (
            echo "dependency_layers_json=$dependency_layers_json"
            echo "dependency_layers_count=$(echo "$dependency_layers_json" | jq length)"
          ) >> "$GITHUB_OUTPUT"

  dependency-layer-0:
    runs-on: ubuntu-latest
    needs:
      - gate
    if: needs.gate.outputs.dependency_layers_count > 0
    strategy:
      matrix:
        module: ${{ fromJson(needs.gate.outputs.dependency_layers_json)[0] }}
    steps:
      - env:
          module_name: ${{ matrix.module }}
        run: |
          echo "$module_name"

  dependency-layer-1:
    runs-on: ubuntu-latest
    needs:
      - gate
      - dependency-layer-0
    if: needs.gate.outputs.dependency_layers_count > 1
    strategy:
      matrix:
        module: ${{ fromJson(needs.gate.outputs.dependency_layers_json)[1] }}
    steps:
      - env:
          module_name: ${{ matrix.module }}
        run: |
          echo "$module_name"

  dependency-layer-2:
    runs-on: ubuntu-latest
    needs:
      - gate
      - dependency-layer-1
    if: needs.gate.outputs.dependency_layers_count > 2
    strategy:
      matrix:
        module: ${{ fromJson(needs.gate.outputs.dependency_layers_json)[2] }}
    steps:
      - env:
          module_name: ${{ matrix.module }}
        run: |
          echo "$module_name"

