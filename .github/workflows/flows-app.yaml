name: Flows App Submission
on:
  issues:
    types:
      - opened
      - edited
      - reopened
jobs:
  flows-app-submit:
    if: |-
      startsWith(github.event.issue.title, '[Flows App]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x

      - run: |
          set -euo pipefail
          npm install
          issue_json="$(
            node .github/workflows/parse-issue.mjs \
              <(echo "$issue_body") \
              .github/ISSUE_TEMPLATE/flows-app.yaml
          )"
          echo "$issue_json"
          signature="$(echo "$issue_json" | jq -r .signature)"
          echo "$signature"
          bundle="$(echo "$issue_json" | jq -r .bundle)"
          echo "$bundle"
        env:
          issue_body: ${{ github.event.issue.body }}

    # - uses: actions/checkout@v7
