[project]
name = "adv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "azure-identity>=1.25.3",
    "cryptography>=46.0.5",
    "fastapi>=0.141.1",
    "pyyaml>=6.0.3",
    "typer>=0.24.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
adv = "adv.app:app"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "marimo>=0.24.2",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "adv"
module-root = ""

[tool.pytest]
markers = [
  "integration: test with external APIs",
]
